# .github/workflows/deploy.yml
name: Deploy Application

on:
  push:
    branches:
      - main
      - 'canary/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected main-branch commit to production
        required: true
        type: boolean
        default: false
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.sum lives in ./backend; without this setup-go finds no
          # dependency file at the repo root and silently skips the build
          # cache, recompiling everything on every run.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: ./backend
        run: go test ./...

      - name: Verify deployment event guard
        run: bash .github/scripts/verify-deploy-workflow.sh

  build-and-push:
    # Pull requests and ordinary manual runs are validation-only. A deployment
    # requires either a push to main or an explicit main-branch manual request.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker refuses an uppercase repository name, but GitHub owner/repo names
      # keep their case (a fork under `MegaTorg/` produced an invalid tag). There
      # is no lowercase function in workflow expressions, so do it in bash.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      # Deploy steps below only work on the upstream repo: the compose files
      # pin the upstream image name (so the sed is a no-op elsewhere, and the
      # commit then fails on an empty tree) and the Portainer secrets are not
      # available to forks. Build-and-push above still runs everywhere.
      - name: Update and commit docker-compose.yml
        if: ${{ !github.event.repository.fork }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B deploy
          # Anchor on a literal tag ([alnum] to end of line) so ${CANARY_IMAGE_TAG:-canary}
          # and other env-templated image tags are left untouched.
          sed -i "s|image: ${IMAGE}:[a-zA-Z0-9]*$|image: ${IMAGE}:${GITHUB_SHA}|g" docker-compose.yml
          sed -i "s|image: ${IMAGE}:[a-zA-Z0-9]*$|image: ${IMAGE}:${GITHUB_SHA}|g" bot-hoster-compose.yml

          git add docker-compose.yml bot-hoster-compose.yml
          git commit -m "ci: Update image tag to ${GITHUB_SHA}"
          git push origin deploy --force

      - name: Trigger Portainer Redeploy Webhook
        if: ${{ !github.event.repository.fork }}
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"

      - name: Trigger Portainer Redeploy Webhook Bot
        if: ${{ !github.event.repository.fork }}
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK_BOT }}
          webhook_secret: "trigger"

  # Canary branches (canary/**) push a branch-tagged image only. It does NOT
  # touch the deploy branch or the production Portainer hooks; the canary
  # bot-hoster on the host pulls the moving `canary` tag. Promotion = merge to
  # main (the normal flow above). Rollback = stop the canary container.
  canary-build-and-push:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/canary/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push canary Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:canary
            ${{ env.IMAGE }}:canary-${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
